# Fixed project name, so containers/volumes are "tierlistfm-*" whatever the folder is called.
name: tierlistfm

services:
  # Per-user app state (settings). Data lives in the pgdata volume, so it
  # survives rebuilds; schema is created by the backend's Flyway migrations.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yt}
      POSTGRES_USER: ${POSTGRES_USER:-yt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT:-48123}:${SERVER_PORT:-48123}"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-yt}
      DB_USER: ${POSTGRES_USER:-yt}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-yt}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:48123}
    environment:
      BACKEND_ORIGIN: http://backend:${SERVER_PORT:-48123}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # Scheduled dumps of the db (prodrigestivill/postgres-backup-local): a
  # gzipped plain-SQL pg_dump every night into ./backups (gitignored), keeping
  # the last 7 daily, 4 weekly and 6 monthly dumps. Restore one with
  # scripts/restore.sh; take one now with scripts/backup.sh.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    # Runs as you, so the dumps in ./backups are yours (set BACKUP_UID/GID in .env).
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-yt}
      POSTGRES_USER: ${POSTGRES_USER:-yt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yt}
      POSTGRES_EXTRA_OPTS: -Z6 --no-owner --no-privileges
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: ${TZ:-UTC}
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
