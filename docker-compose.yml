services:
  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT:-48123}:${SERVER_PORT:-48123}"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:48123}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
