services:
  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5183}:80"
    depends_on:
      - backend
