# The scheme the browser used: a reverse proxy in front (Traefik, Caddy, ...)
# that terminated HTTPS says so in X-Forwarded-Proto - pass that on, else this
# hop's own. Spring builds Google's redirect_uri from it and X-Forwarded-Host
# (Host with its port - X-Forwarded-Proto alone makes Spring drop the port).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text on the way out: the JS/CSS bundles are ~1.5 MB raw and
    # ~0.45 MB gzipped - the biggest single cost of a first visit. Also
    # covers API JSON proxied below (gzip_proxied any).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json
               application/problem+json application/manifest+json image/svg+xml text/plain;

    # The API on this origin too: without this, /api/** fell through to the
    # SPA page below - a GET got index.html (200) and a POST a bare nginx 405,
    # never the backend's 401 ProblemDetail. BACKEND_ORIGIN is filled in by the
    # nginx image's envsubst at start (this file is a template).
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Google login on this origin as well: the start (/oauth2/authorization/google)
    # and Google's callback (/login/oauth2/code/google), so the redirect URI is
    # <TIERLIST_URL>/login/oauth2/code/google and the backend needs no host port.
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed bundles (index-<hash>.js) never change - cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and manifest must always be revalidated, or the
    # installed app keeps running an old deploy. A missing one is a 404, never
    # the SPA page (a browser can't update a worker from an HTML response).
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The page itself is revalidated on every load, so a new deploy shows up
    # without a hard reload. Its own block: app routes (/settings, ...) reach
    # it through try_files' internal redirect, which skips the headers of
    # `location /`.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
